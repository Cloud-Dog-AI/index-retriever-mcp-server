# requirements.lock — index-retriever-mcp-server (W28A-861-R3)
#
# Pinned third-party runtime dependencies, resolved for python 3.12 against the
# PUBLIC index (https://pypi.org/simple/) with pip-tools (pip-compile,
# --strip-extras). lxml and xmlsec are source-built (--no-binary) to match the
# pinned versions the platform IDAM/SAML stack requires.
#
# Install exactly these (no resolver):
#   pip install --no-deps -r requirements.lock --index-url "${PYPI_URL:-https://pypi.org/simple/}"
#
# IMPORTANT — partial lock:
#   The 9 Cloud-Dog platform packages (cloud-dog-config, cloud-dog-logging,
#   cloud-dog-api-kit, cloud-dog-idam, cloud-dog-db, cloud-dog-jobs,
#   cloud-dog-storage, cloud-dog-llm, cloud-dog-vdb) are NOT yet published to the
#   public index, so they CANNOT be pinned here from the public boundary. See
#   requirements.lock.EXCEPTION.md for the coordinator-approval gap and the exact
#   version constraints from pyproject.toml. Their own transitive deps are also
#   not represented in this file until they are published.
#
# --no-binary directives:
--no-binary lxml
--no-binary xmlsec
