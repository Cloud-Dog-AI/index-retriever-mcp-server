# requirements.lock — index-retriever-mcp-server (W28A-861-R3)
#
# FULL sealed lock. Pinned runtime dependencies — the 9 Cloud-Dog platform
# packages AND the 39 third-party packages — resolved for python 3.12 and
# verified to install end-to-end (Dockerfile.public, GREEN build on server2,
# 2026-06-08). lxml and xmlsec are source-built (--no-binary) to match the
# pinned versions the platform IDAM/SAML stack requires.
#
# Index-agnostic: this file pins versions only. It carries NO index URL and NO
# credentials. The active package index is supplied at install time by the
# caller (the `pip_conf` BuildKit secret in Dockerfile.public, or --index-url),
# per PS-97 §3.3 single-index. The platform packages and these exact versions
# are present on the internal index (pypi.cloud-dog.net); when they are also
# published to the public boundary index the same pins resolve unchanged.
#
# Install exactly these (no resolver):
#   pip install --no-deps -r requirements.lock --index-url "${PYPI_URL}"
#
# --no-binary directives:
--no-binary lxml
--no-binary xmlsec
