version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: index-retriever-pgvector
    profiles:
      - pgvector
    network_mode: host
    command: ["postgres", "-c", "port=15432"]
    environment:
      POSTGRES_DB: index_retriever_w28a775
      POSTGRES_USER: index_retriever
      POSTGRES_PASSWORD: index_retriever_w28a775
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 15432 -U index_retriever -d index_retriever_w28a775"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      network: host
      secrets:
        - pip_conf
        - pip_netrc
    container_name: index-retriever-api
    command: api
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - CLOUD_DOG__API_SERVER__PORT=${CLOUD_DOG__API_SERVER__PORT}
      - CLOUD_DOG__API_SERVER__HOST=${CLOUD_DOG__API_SERVER__HOST}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./certs:/app/certs
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: .
      network: host
      secrets:
        - pip_conf
        - pip_netrc
    container_name: index-retriever-mcp
    command: mcp
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - CLOUD_DOG__MCP_SERVER__PORT=${CLOUD_DOG__MCP_SERVER__PORT}
      - CLOUD_DOG__MCP_SERVER__HOST=${CLOUD_DOG__MCP_SERVER__HOST}
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  all-in-one:
    build:
      context: .
      network: host
      secrets:
        - pip_conf
        - pip_netrc
    container_name: index-retriever-all
    command: all
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./certs:/app/certs
    profiles:
      - all-in-one
    restart: unless-stopped

secrets:
  pip_conf:
    file: ${PIP_CONF_FILE:-.run/pip.conf.compose}
  pip_netrc:
    file: ${PIP_NETRC_FILE:-.run/pip.netrc.compose}
