version: '3.8'

services:
  api:
    build:
      context: .
      network: host
    container_name: index-retriever-api
    command: api
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - CLOUD_DOG__INDEX__API_SERVER__PORT=8686
      - CLOUD_DOG__INDEX__API_SERVER__HOST=0.0.0.0
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./certs:/app/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: .
      network: host
    container_name: index-retriever-mcp
    command: mcp
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - CLOUD_DOG__INDEX__MCP_SERVER__PORT=8687
      - CLOUD_DOG__INDEX__MCP_SERVER__HOST=0.0.0.0
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # All-in-one (development only)
  all-in-one:
    build:
      context: .
      network: host
    container_name: index-retriever-all
    command: all
    user: "0:0"
    network_mode: host
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./certs:/app/certs
    profiles:
      - all-in-one
    restart: unless-stopped
