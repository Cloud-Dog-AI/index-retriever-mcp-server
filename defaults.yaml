api_server:
  host: "0.0.0.0"
  port: 8074
  base_path: "${CLOUD_DOG__INDEX_RETRIEVER__API_SERVER__BASE_PATH:/api/v1}"
  api_key: "${CLOUD_DOG__INDEX__AUTH__ADMIN_API_KEY || ''}"

web_server:
  host: "0.0.0.0"
  port: 8075
  base_path: "${CLOUD_DOG__INDEX_RETRIEVER__WEB_SERVER__BASE_PATH || ''}"

mcp_server:
  host: "0.0.0.0"
  port: 8076
  base_path: "${CLOUD_DOG__INDEX_RETRIEVER__MCP_SERVER__BASE_PATH:/mcp}"
  transport: "streamable-http"

a2a_server:
  host: "0.0.0.0"
  port: 8077
  base_path: "${CLOUD_DOG__INDEX_RETRIEVER__A2A_SERVER__BASE_PATH:/a2a}"

external:
  HDRO:
    url: "https://hdrdata.org"
    username: ""

web_login:
  username: "${CLOUD_DOG_WEB_LOGIN_USERNAME:admin}"
  password: "${CLOUD_DOG_WEB_LOGIN_PASSWORD || ''}"
  read_write_username: "${CLOUD_DOG_WEB_LOGIN_READ_WRITE_USERNAME:read-write}"
  read_write_password: "${CLOUD_DOG_WEB_LOGIN_READ_WRITE_PASSWORD || ''}"
  read_only_username: "${CLOUD_DOG_WEB_LOGIN_READ_ONLY_USERNAME:read-only}"
  read_only_password: "${CLOUD_DOG_WEB_LOGIN_READ_ONLY_PASSWORD || ''}"

auth:
  mode: "apikey+jwt"
  jwt:
    issuer: "${JWT_ISSUER || ''}"
    audience: "${JWT_AUDIENCE || ''}"
    public_keys_url: "${JWT_JWKS_URL || ''}"

storage:
  db:
    url: "${DB_URL:sqlite+aiosqlite:///./data/index_retriever.db}"   # e.g. postgresql+asyncpg://...
  audit:
    path: "${AUDIT_LOG_PATH:./logs/audit.log}"

queue:
  backend: "${CLOUD_DOG__INDEX__QUEUE__BACKEND:sql}"
  database_url: "${INDEX_RETRIEVER_DB_URL:${DB_URL:sqlite+aiosqlite:///./data/index_retriever.db}}"
  server_id: "${INDEX_RETRIEVER_SERVER_ID:${HOSTNAME:index-retriever-local}}"
  max_concurrency: 8
  per_profile_concurrency: 2
  queue_wait_timeout_seconds: 1800
  default_timeout_seconds: 1800
  claim_timeout_seconds: 60
  retry:
    max_attempts: 3
    backoff_seconds: 5
  redis:
    enabled: false
    url: "${REDIS_URL:redis://127.0.0.1:6379/0}"

outbound:
  discovery:
    ttl_seconds: 300
  mcp:
    path: "/mcp"
    timeout_seconds: 30
    failure_threshold: 3
    reset_seconds: 60
  a2a:
    tasks_path: "/a2a/tasks"
    timeout_seconds: 30
    failure_threshold: 3
    reset_seconds: 60
  services:
    search-mcp:
      credential_config_key: "dev.services.searchmcp0.api_key"
      credential_header: "X-API-Key"
      mcp_path: "/mcp"
      tasks_path: "/a2a/tasks"

dev:
  services:
    indexretriever:
      default_pipelines:
        search_mcp_enrich:
          enabled: false
          profiles: []
          collections: []
          source_uri_globs: []
          pipeline:
            - enrich: search-mcp.enrich(query=$doc.title, depth=quick)
              transport: a2a
              required: false

profiles:
  default:
    enabled: true
    vdb:
      type: "chroma"
      chroma:
        mode: "local"
        path: "${CHROMA_PATH:./data/chroma}"
        collection: "default"
    embeddings:
      provider: "openai_compat"
      openai_compat:
        base_url: "${EMBED_BASE_URL:http://localhost:11434}"
        api_key: "${EMBED_API_KEY || ''}"
        model: "nomic-embed-text"
        timeout_seconds: 60
    ingestion:
      allowed_sources: ["upload", "text", "filesystem", "s3", "webdav", "gdrive"]
      filesystem:
        roots: ["${INGEST_ROOT:./uploads}"]
        deny_globs: ["**/.git/**", "**/node_modules/**"]
      max_file_mb: 50
      dedupe:
        mode: "hash"
        policy: "skip"  # skip|replace|version
    chunking:
      strategy: "token"
      chunk_size: 800
      chunk_overlap: 100
    search:
      top_k_default: 10
      score_threshold: 0.0

rbac:
  enabled: true
  default_deny: true
  roles:
    admin: ["*"]
    maintainer: ["profiles_*", "collections_*", "ingest_*", "search", "retrieve", "delete_*", "retention_*", "reindex_*", "job_*", "queue_status", "backend_health_check", "embedding_health_check"]
    writer: ["ingest_*", "search", "retrieve", "job_list", "job_get", "job_wait", "job_stream", "queue_status"]
    reader: ["profiles_list", "profile_get", "collections_list", "collection_get", "search", "retrieve", "search_explain", "job_get", "queue_status"]

log:
  service_instance: "${HOSTNAME:index-retriever-local}"
  environment: "${CLOUD_DOG_ENVIRONMENT:dev}"
  api_server_log: "logs/api_server.log"
  web_server_log: "logs/web_server.log"
  mcp_server_log: "logs/mcp_server.log"
  a2a_server_log: "logs/a2a_server.log"
  audit_log: "logs/audit.log.jsonl"
  retention:
    hot_days: 14
    cold_days: 60
    archive_format: "gz"
  integrity:
    enabled: true
    interval_seconds: 300
    log_file: "logs/audit-integrity.log"
    hash_algorithm: "sha256"
  rotation:
    mode: "size"
    max_bytes: 104857600
    backup_count: 10
    when: "midnight"
    interval: 1
    compress: true

# Ingest concurrency/batch + test run-prefix consumed via cloud_dog_config get_config
# (migrated from os.environ — RULES §1.4.1). Override with CLOUD_DOG__INDEX__INGEST__BATCH_SIZE etc.
index:
  ingest:
    max_concurrency_per_profile: 1
    batch_size: 10
  test_run_prefix: ""
  bootstrap:
    # Location of the optional bootstrap-seed.yaml (users/groups/api-keys). Empty
    # falls back to the container default /app/config/bootstrap-seed.yaml. Override
    # with CLOUD_DOG__INDEX__BOOTSTRAP__SEED_PATH. (RULES §1.4.1: config, not env.)
    seed_path: ""
    seed_disabled: false
  demo_profiles:
    # W28E-1878 (IR-23): demo/reference profiles are NOT shipped in defaults.yaml;
    # they live in the opt-in config/demo-profiles.yaml. A clean production install
    # lists only the 'default' profile. They load ONLY when enabled below is truthy —
    # an opt-in for demo/dev/preprod environments. Override with
    # CLOUD_DOG__INDEX__DEMO_PROFILES__ENABLED / __PATH. (RULES §1.4.1: config, not env.)
    enabled: false
    # Location of the optional demo-profiles.yaml. Empty falls back to the container
    # default /app/config/demo-profiles.yaml, then the repo-relative config file.
    path: ""
