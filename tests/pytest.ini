[pytest]
markers =
    QT: quality/compliance tests
    UT: unit tests
    ST: system tests
    IT: integration tests
    AT: application/acceptance tests
    api: REST API surface
    mcp: MCP tool/resource surface
    a2a: A2A agent surface
    webui: WebUI/browser surface
    cli: command-line surface
    internal: internal implementation surface
    req(*ids): requirement binding per PS-REQ-TEST-TRACE
    negative: negative/security/error-path test
    probe: exploratory probe marker; not allowed in Stream-A-bound test files
    slow: slow-running test
    llm: live LLM/embedding provider test
    external: external dependency test
    flaky: quarantined/flaky test marker
