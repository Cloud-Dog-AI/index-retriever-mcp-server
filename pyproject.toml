[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "index-retriever-mcp-server"
version = "0.1.3RC1"
description = "API-first MCP server for vector database indexing, searching, and retrieval for agentic flows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
dependencies = [
    # Platform packages (from internal PyPI)
    "cloud_dog_config==0.3.5",
    "cloud_dog_logging==0.4.1",
    "cloud_dog_cache==0.2.3",
    # W28E-1870-A: change-stream foundation (PS-102). ``change-stream-db`` extra
    # pulls the SqlJournal deps (already satisfied by cloud_dog_db + SQLAlchemy below).
    "cloud_dog_api_kit[change-stream-db]==0.14.1",
    "cloud_dog_idam==0.5.4",
    "cloud_dog_jobs==0.4.4",
    "cloud_dog_db==0.3.3",
    "cloud_dog_storage==0.1.8",
    "cloud_dog_llm==0.4.1",
    "cloud_dog_vdb==0.5.6",
    # Core runtime
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0.1,<7.0",
    "ruamel.yaml>=0.18.6,<1.0",
    "typing-extensions>=4.10,<5.0",
    # HTTP / streaming
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.30,<1.0",
    "sse-starlette>=2.1,<3.0",
    "websockets>=12.0,<13.0",
    # Storage (profiles/jobs/audit metadata)
    "SQLAlchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "filelock>=3.15,<4.0",
    # Retries
    "tenacity>=8.2,<9.0",
    # Content ingestion / conversion
    "chardet>=5.2,<6.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml==5.2.2",
    "xmlsec>=1.3.14,<1.4",
    "markdown-it-py>=3.0,<4.0",
    # Hashing
    "xxhash>=3.4,<4.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1.0"]
redis = ["redis>=5.0,<6.0"]
pandoc = ["pypandoc>=1.13,<2.0"]
pdf = ["pdfminer.six>=20231228"]
office = ["python-docx>=1.1,<2.0", "openpyxl>=3.1,<4.0", "odfpy>=1.4,<2.0"]
llamaindex = [
    "llama-index-core>=0.11,<0.12",
    "llama-index-readers-file>=0.2,<0.3",
    "llama-index-embeddings-openai>=0.2,<0.3",
    "llama-index-embeddings-huggingface>=0.2,<0.3",
]
langchain = [
    "langchain>=0.2,<0.4",
    "langchain-community>=0.2,<0.4",
]
connectors = [
    "boto3>=1.34,<2.0",
    "webdavclient3>=3.14,<4.0",
    "google-api-python-client>=2.140,<3.0",
    "google-auth>=2.33,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "aiohttp>=3.9,<4.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "playwright>=1.52,<2.0",
    "Pillow>=10.4,<12.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/index_tools", "src/index_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cloud_dog_config"
filterwarnings = [
    "ignore:Passing 'msg' argument to.*cancel:DeprecationWarning",
    "ignore::RuntimeWarning:runpy",
]
markers = [
    "integration: tests requiring live VDB, embedding provider, and running API server",
]

[project.urls]
"Source" = "https://github.com/cloud-dog-ai/index-retriever-mcp-server"
